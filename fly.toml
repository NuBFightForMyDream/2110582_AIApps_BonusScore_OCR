app = "flowledger-fridge-demo"
primary_region = "sin"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Sleep when nobody is visiting; wake on the next request.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
