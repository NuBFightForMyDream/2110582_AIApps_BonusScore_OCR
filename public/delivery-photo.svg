<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <title>Delivery photo: side-by-side fridge installed in the customer's kitchen</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4dfd6"/>
      <stop offset="1" stop-color="#cfc7ba"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b08d66"/>
      <stop offset="1" stop-color="#8a6a49"/>
    </linearGradient>
    <linearGradient id="steelL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b6168"/>
      <stop offset="0.55" stop-color="#8c939a"/>
      <stop offset="1" stop-color="#6c7279"/>
    </linearGradient>
    <linearGradient id="steelR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6c7279"/>
      <stop offset="0.45" stop-color="#9aa1a8"/>
      <stop offset="1" stop-color="#5d636a"/>
    </linearGradient>
    <linearGradient id="cab" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3f1ec"/>
      <stop offset="1" stop-color="#e2ded6"/>
    </linearGradient>
    <radialGradient id="light" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.22"/>
    </radialGradient>
  </defs>

  <!-- room -->
  <rect width="600" height="640" fill="url(#wall)"/>
  <rect y="640" width="600" height="160" fill="url(#floor)"/>
  <g stroke="#7a5c3e" stroke-width="2" opacity="0.5">
    <line x1="0" y1="672" x2="600" y2="672"/>
    <line x1="0" y1="712" x2="600" y2="712"/>
    <line x1="0" y1="758" x2="600" y2="758"/>
    <line x1="140" y1="640" x2="120" y2="672"/>
    <line x1="420" y1="672" x2="400" y2="712"/>
    <line x1="250" y1="712" x2="225" y2="758"/>
    <line x1="520" y1="758" x2="495" y2="800"/>
  </g>
  <rect y="628" width="600" height="14" fill="#efebe4"/>

  <!-- kitchen cabinets either side -->
  <rect x="0" y="380" width="110" height="250" fill="url(#cab)" stroke="#cfc9be"/>
  <rect x="0" y="366" width="118" height="16" fill="#8f8a82"/>
  <rect x="0" y="60" width="110" height="200" fill="url(#cab)" stroke="#cfc9be"/>
  <rect x="80" y="440" width="18" height="4" rx="2" fill="#9b968e"/>
  <rect x="80" y="200" width="18" height="4" rx="2" fill="#9b968e"/>
  <rect x="500" y="380" width="100" height="250" fill="url(#cab)" stroke="#cfc9be"/>
  <rect x="492" y="366" width="108" height="16" fill="#8f8a82"/>
  <rect x="500" y="60" width="100" height="200" fill="url(#cab)" stroke="#cfc9be"/>
  <rect x="512" y="440" width="18" height="4" rx="2" fill="#9b968e"/>

  <!-- shadow -->
  <ellipse cx="305" cy="648" rx="200" ry="14" fill="#000" opacity="0.28"/>

  <!-- side-by-side fridge -->
  <rect x="130" y="112" width="350" height="528" rx="10" fill="#4a5056"/>
  <rect x="136" y="118" width="168" height="500" rx="6" fill="url(#steelL)"/>
  <rect x="306" y="118" width="168" height="500" rx="6" fill="url(#steelR)"/>
  <!-- handles -->
  <rect x="284" y="200" width="9" height="300" rx="4" fill="#c9ced3" stroke="#5a6067"/>
  <rect x="317" y="200" width="9" height="300" rx="4" fill="#c9ced3" stroke="#5a6067"/>
  <!-- water / ice dispenser and display -->
  <rect x="170" y="210" width="84" height="120" rx="8" fill="#2c3136"/>
  <rect x="182" y="222" width="60" height="22" rx="3" fill="#0f1418"/>
  <text x="212" y="238" font-family="Arial, sans-serif" font-size="13" fill="#6fd0ff" text-anchor="middle">3°C</text>
  <rect x="196" y="262" width="32" height="44" rx="4" fill="#3d4349"/>
  <!-- base grille -->
  <rect x="140" y="620" width="330" height="16" rx="3" fill="#30353a"/>
  <g stroke="#4c5258" stroke-width="2">
    <line x1="160" y1="628" x2="450" y2="628"/>
  </g>
  <!-- protective film corner still on, as on a fresh delivery -->
  <path d="M474 118 L474 168 L430 118 Z" fill="#dfe9ef" opacity="0.75"/>
  <!-- energy label sticker -->
  <rect x="352" y="380" width="52" height="70" rx="3" fill="#fff"/>
  <rect x="358" y="388" width="34" height="7" fill="#2a9d3c"/>
  <rect x="358" y="398" width="28" height="7" fill="#7cc142"/>
  <rect x="358" y="408" width="22" height="7" fill="#f2c200"/>
  <rect x="358" y="418" width="16" height="7" fill="#f08a1c"/>
  <rect x="358" y="428" width="10" height="7" fill="#d7281f"/>

  <!-- camera vignette and date stamp -->
  <rect width="600" height="800" fill="url(#light)"/>
  <text x="572" y="778" font-family="'Courier New', monospace" font-size="24" font-weight="700" fill="#ff8c1a" text-anchor="end">21/11/2026 14:32</text>
</svg>
